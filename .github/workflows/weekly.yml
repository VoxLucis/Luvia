name: Weekly semiconductor intelligence update
on:
  schedule:
    - cron: '0 1 * * 0' # Sunday 09:00 Asia/Taipei
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  sync:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    concurrency:
      group: semicon-data-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_news.py
      - name: Generate AI industry brief (optional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python ai_analyze.py
      - name: Scan fab milestones and compare AI candidates (optional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python fab_scan.py
      - name: Collect equipment technology signals (title-only; unverified)
        run: python equipment_scan.py
      - name: Compare saved weekly event headlines
        run: python event_history.py
      - name: Scan allowlisted official product pages (best effort)
        run: python official_matrix.py
      - name: Commit weekly archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Update weekly semiconductor intelligence' && git push)
  company-registry:
    if: github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '【企業追蹤】')
    runs-on: ubuntu-latest
    concurrency:
      group: semicon-company-registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and update company registry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python company_request.py
      - name: Commit company list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/companies.json
          git diff --cached --quiet || (git commit -m 'Update tracked companies' && git push)
      - name: Close processed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "企業追蹤名單已更新；新來源文章會在下一次每週更新時蒐集。"
