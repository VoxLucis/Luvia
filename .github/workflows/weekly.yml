name: Weekly semiconductor intelligence update
on:
  schedule:
    - cron: '0 1 * * 0' # Sunday 09:00 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_news.py
      - name: Generate AI industry brief (optional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python ai_analyze.py
      - name: Commit weekly archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Update weekly semiconductor intelligence' && git push)
