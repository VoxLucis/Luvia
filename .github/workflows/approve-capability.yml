name: Review official equipment capability candidate
on:
  workflow_dispatch:
    inputs:
      capability_id:
        description: Candidate ID shown in technology matrix (cap-...)
        type: string
        required: true
      decision:
        description: Approve only after personally reading the official source
        type: choice
        options: [approve, reject]
        required: true
      product:
        description: Verified product or platform name (required for approval)
        type: string
        required: false
      review_note:
        description: Human review note (15–800 characters, cite exactly what the official page says)
        type: string
        required: true
permissions:
  contents: write
jobs:
  review:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    concurrency:
      group: semicon-data-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed official evidence
        env:
          CAPABILITY_ID: ${{ inputs.capability_id }}
          CAPABILITY_DECISION: ${{ inputs.decision }}
          CAPABILITY_PRODUCT: ${{ inputs.product }}
          CAPABILITY_REVIEW_NOTE: ${{ inputs.review_note }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python capability_review.py
      - name: Commit review and evidence history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/equipment_matrix.json data/capability_candidates.json data/capability_review_history.json
          git diff --cached --quiet || (git commit -m 'Human review of official equipment capability' && git push)
